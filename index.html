<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Night Survivors 幸存者之夜</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2312162a'/%3E%3Crect x='4' y='3' width='8' height='9' fill='%23e0486a'/%3E%3Crect x='6' y='5' width='1' height='2' fill='%23fff'/%3E%3Crect x='9' y='5' width='1' height='2' fill='%23fff'/%3E%3C/svg%3E" />
    <style>
      html,
      body {

        height: 100%;

      }
      #game {
        width: 100vw;
        height: 100vh;
        display: block;

      canvas {
        image-rendering: pixelated;
      }
      #loading {
        position: fixed;
        inset: 0;

        display: grid;
        place-items: center;
        letter-spacing: 2px;
      }

    <div id="game"></div>
    <div id="loading">LOADING…</div>
